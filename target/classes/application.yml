server:
  port: 8080

spring:
  application:
    name: shield-gateway
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

gateway:
  rate-limit:
    capacity: 10
    refill-rate-per-second: 2
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971"
    enabled: true
  routes:
    - path: "/users/**"
      target-url: "https://jsonplaceholder.typicode.com"
      strip-prefix: false
    - path: "/httpbin/**"
      target-url: "https://httpbin.org"
      strip-prefix: true