services:
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: shield-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  shield-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shield-gateway-app
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
